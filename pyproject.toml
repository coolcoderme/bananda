[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bananda"
version = "0.1.0"
description = "Kivy-like Python UI that transpiles to Kotlin (Android), C++ (Linux), and C# (Windows) — no interpreter in the shipped app."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "coolcoderme" }]
keywords = ["android", "linux", "windows", "kotlin", "cpp", "csharp", "kivy", "transpile", "apk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bananda = "bananda.cli:main"

[project.urls]
Homepage = "https://github.com/coolcoderme/bananda"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bananda = ["runtime/**/*", "templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples"]
